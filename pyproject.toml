[project]
name = "mlresearch"
version = "0.1.0"
description = "Machine learning research workspace."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "h5py>=3.11",
    "matplotlib>=3.9",
    "numpy>=2.0",
    "scipy>=1.14",
]

[project.scripts]
mlresearch = "mlresearch:main"

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["mypy>=1.13", "pytest>=8", "ruff>=0.9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
files = ["src/mlresearch"]
check_untyped_defs = true
disallow_untyped_defs = true
ignore_missing_imports = true
